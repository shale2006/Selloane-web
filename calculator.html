<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interactive Calculator</title>
</head>
<body>
    <h1>Interactive Calculator</h1>

    
    <input type="number" id="number1" placeholder="First number">
    <input type="number" id="number2" placeholder="Second number">
    <input type="number" id="number3" placeholder="Third number">

    
    <input type="email" id="email" placeholder="Email address">

    
    <button id="calculateButton">Calculate Sum</button>

    
    <p id="result">The sum will appear here.</p>

    <script>
        
        const calculateButton = document.getElementById("calculateButton");
        const result = document.getElementById("result");

        
        calculateButton.addEventListener("click", function () {
            
            const number1 = Number(document.getElementById("number1").value);
            const number2 = Number(document.getElementById("number2").value);
            const number3 = Number(document.getElementById("number3").value);

            
            const sum = number1 + number2 + number3;

            
            result.textContent = "The sum is: " + sum;
        });
    </script>
</body>
</html>
